# JalRakshak on a single Amazon EC2 instance.
#
# Nginx serves the built React files, and hands /api to PHP-FPM running Laravel.
# Both live on the same box, so the frontend calls /api on its own origin and
# there is no CORS to configure.
#
# Install:
#   sudo cp nginx-jalrakshak.conf /etc/nginx/sites-available/jalrakshak
#   sudo ln -sf /etc/nginx/sites-available/jalrakshak /etc/nginx/sites-enabled/jalrakshak
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # The Vite build of the React app.
    root /var/www/jalrakshak-aws/web/dist;
    index index.html;

    charset utf-8;
    client_max_body_size 12M;

    access_log /var/log/nginx/jalrakshak.access.log;
    error_log  /var/log/nginx/jalrakshak.error.log;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css text/plain application/javascript application/json image/svg+xml;

    # Hashed Vite assets never change under the same name.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Laravel API. ^~ wins over the regex locations below, so /api never falls
    # through to the SPA. Unknown paths go to Laravel's front controller with
    # the original request URI intact.
    location ^~ /api {
        root /var/www/jalrakshak-aws/api/public;
        try_files $uri /index.php?$query_string;
    }

    # Laravel's built in health probe, handy for a load balancer later.
    location = /up {
        root /var/www/jalrakshak-aws/api/public;
        try_files $uri /index.php?$query_string;
    }

    location ~ \.php$ {
        root /var/www/jalrakshak-aws/api/public;

        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_hide_header X-Powered-By;
    }

    # React Router: anything else returns the SPA shell.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}
