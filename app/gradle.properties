# Gradle JVM. 2GB kaafi hai is size ke project ke liye; laptop pe emulator bhi
# saath chal raha hota hai, isliye jaan-bujh ke zyada nahi rakha.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# AndroidX zaroori hai (Compose AndroidX pe hi chalta hai).
android.useAndroidX=true

# Kotlin ka official code style.
kotlin.code.style=official

# Sirf wahi ABI resources rakho jo chahiye — build thoda halka rehta hai.
android.nonTransitiveRClass=true
